<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>경제 퀴즈 · 난이도 선택</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="site-theme.css" />
  <link rel="stylesheet" href="auth.css" />
  <script src="auth-config.js"></script>
  <script src="auth.js"></script>
  <style>
    :root {
      --font: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --card-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 24px 48px -12px rgba(14, 165, 233, 0.28);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font);
      padding: clamp(24px, 5vw, 48px) 20px 120px;
      min-height: 100vh;
      color: var(--text);
      }
    .shell {
      max-width: 720px;
      margin: 0 auto;
    }
    .page-eyebrow {
      display: block;
      text-align: center;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      width: fit-content;
      margin: 0 auto 0.75rem;
    }
    
    .app-title {
      text-align: center;
      
      margin-bottom: clamp(18px, 4vw, 26px);
      font-size: clamp(1.5rem, 4.5vw, 2.1rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.2;
      
    }
    .page-card {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 24px;
      padding: clamp(32px, 5vw, 48px) clamp(22px, 4vw, 40px);
      max-width: 720px;
      margin: 0 auto 72px;
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(255, 255, 255, 0.65);
    }
    .wrap { max-width: 100%; margin: 0 auto; padding: 0; }

    :root {
      --color-text-primary: #333;
      --color-text-secondary: #666;
      --color-text-tertiary: #999;
      --color-text-success: #4caf50;
      --color-text-info: #0284c7;
      --color-text-warning: #e65100;
      --color-text-danger: #f44336;
      --color-background-primary: #fff;
      --color-background-secondary: #f5f7fa;
      --color-border-tertiary: #e0e0e0;
      --color-border-secondary: #d0d0d0;
      --color-background-success: #e8f5e9;
      --color-border-success: #81c784;
      --color-background-danger: #ffebee;
      --color-border-danger: #ef9a9a;
      --color-background-warning: #fff8e1;
      --color-border-warning: #ffe082;
    }

    .bar { height: 8px; background: var(--sky-100);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 8px;
      transition: width 0.3s ease;
      background: linear-gradient(90deg, #0ea5e9, #0284c7);
    }
    .bar-sm { height: 5px; margin-bottom: 18px; }

    .btn {
      display: block;
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      font-size: 0.95em;
      color: #333;
      text-align: left;
      line-height: 1.5;
      transition: all 0.3s ease;
      position: relative;
      font-family: inherit;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
    }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled {
      cursor: default;
      opacity: 0.65;
      transform: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .btn-main {
      padding: 16px 18px;
      font-size: 1.1em;
      font-weight: 700;
      margin-bottom: 16px;
      text-align: center;
      color: var(--sky-600);
      background: var(--sky-100);
      border: 1px solid var(--sky-200);
      box-shadow: none;
    }
    .btn-main:hover:not(:disabled) {
      background: var(--sky-200);
      border-color: var(--sky-300);
    }

    .btn-next {
      display: inline-block;
      width: auto;
      padding: 12px 32px;
      font-size: 1.05em;
      font-weight: 700;
      text-align: center;
      color: var(--sky-600);
      background: var(--sky-100);
      border: 1px solid var(--sky-200);
      box-shadow: none;
    }
    .btn-next:hover:not(:disabled) {
      background: var(--sky-200);
      border-color: var(--sky-300);
    }

    .cat-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      font-size: 0.92em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      color: #333;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .cat-bar {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 4px;
      display: inline-block;
      position: relative;
      vertical-align: middle;
    }
    .cat-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #0ea5e9, #0284c7);
    }

    .opt-num {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 26px;
      height: 26px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8em;
      font-weight: 800;
      background: rgba(14, 165, 233, 0.14);
      color: #0284c7;
      flex-shrink: 0;
    }
    .btn.bg-ok .opt-num { background: rgba(76, 175, 80, 0.2); color: var(--color-text-success); }
    .btn.bg-err .opt-num { background: rgba(244, 67, 54, 0.15); color: var(--color-text-danger); }

    .opt-label {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.75em;
      font-weight: 700;
    }

    .weak-box {
      background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
      border: 1px solid #ffe082;
      border-radius: 15px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(230, 81, 0, 0.1);
    }

    .review-btn {
      margin-bottom: 8px;
      text-align: center;
      color: #c2410c;
      font-weight: 700;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      box-shadow: none;
    }

    .card {
      background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf4 100%);
      border-radius: 15px;
      padding: 24px;
      cursor: pointer;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .ex-box {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #e0e0e0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .wrong-ref-wrap { margin-top: 10px; }
    .wrong-ref-intro {
      font-size: 11px;
      color: var(--color-text-secondary);
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .wrong-ref-tab {
      margin-bottom: 8px;
      border: 1px solid var(--color-border-tertiary);
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
    }
    .wrong-ref-tab > summary {
      cursor: pointer;
      list-style: none;
      font-weight: 700;
      font-size: 12px;
      padding: 10px 12px;
      background: linear-gradient(135deg, #f0f9ff 0%, #f1f5f9 100%);
      color: #0369a1;
      user-select: none;
    }
    .wrong-ref-tab > summary::-webkit-details-marker { display: none; }
    .wrong-ref-tab > summary::marker { content: ""; }
    .wrong-ref-tab[open] > summary { border-bottom: 1px solid var(--color-border-tertiary); }
    .wrong-ref-tab-body { padding: 10px 12px 12px; font-size: 0.86rem; line-height: 1.55; color: var(--color-text-primary); }

    .link-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.95em;
      color: #0284c7;
      font-weight: 600;
      padding: 4px 0;
      font-family: inherit;
      transition: color 0.2s ease;
    }
    .link-btn:hover { text-decoration: underline; color: #0284c7; }

    .progress-box {
      background: #f5f7fa;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.82em;
      color: #999;
      margin-bottom: 6px;
    }

    .c-ok { color: #4caf50; }
    .c-info { color: #0284c7; }
    .c-warn { color: #e65100; }
    .c-err { color: #f44336; }

    .bg-ok {
      background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%) !important;
      border: 2px solid #4caf50 !important;
      color: #1b5e20 !important;
      box-shadow: 0 2px 12px rgba(76, 175, 80, 0.25) !important;
    }
    .bg-err {
      background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%) !important;
      border: 2px solid #f44336 !important;
      color: #b71c1c !important;
      box-shadow: 0 2px 12px rgba(244, 67, 54, 0.2) !important;
    }

    .diff-pick {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .diff-pick .btn {
      flex: 1;
      text-align: center;
      margin-bottom: 0;
      padding: 14px 12px;
      font-size: 0.95em;
      line-height: 1.35;
    }
    .diff-pick .btn small {
      display: block;
      font-size: 0.72em;
      font-weight: 600;
      opacity: 0.88;
      margin-top: 4px;
    }
    .diff-pick .btn--on {
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      color: #fff;
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.45);
    }

    .econ-topnav {
      display: flex;
      gap: 8px;
      margin: -8px 0 20px;
      padding: 6px;
      background: linear-gradient(135deg, #f1f5f9 0%, #e8e0f7 100%);
      border-radius: 14px;
      border: 1px solid rgba(2, 132, 199, 0.12);
    }
    .econ-topnav__btn {
      flex: 1;
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      color: #0284c7;
      background: transparent;
      transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }
    .econ-topnav__btn:hover {
      background: rgba(255, 255, 255, 0.65);
    }
    .econ-topnav__btn.is-on {
      color: #fff;
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      box-shadow: 0 4px 14px rgba(102, 126, 234, 0.4);
    }

    .concept-wrap {
      color: var(--color-text-primary);
      font-size: 0.9rem;
      line-height: 1.65;
    }
    .concept-wrap h2 {
      font-size: 1.05rem;
      font-weight: 800;
      color: #0284c7;
      margin: 1.25rem 0 0.5rem;
      letter-spacing: -0.02em;
    }
    .concept-wrap h2:first-child { margin-top: 0; }
    .concept-wrap h3 {
      font-size: 0.88rem;
      font-weight: 700;
      color: #0284c7;
      margin: 1rem 0 0.35rem;
    }
    .concept-wrap ul {
      margin: 0.25rem 0 0.75rem 1.1rem;
      padding: 0;
    }
    .concept-wrap li { margin-bottom: 0.35rem; }
    .concept-wrap .concept-note {
      font-size: 0.82rem;
      color: var(--color-text-secondary);
      background: #f8fafc;
      border-left: 3px solid #bae6fd;
      padding: 10px 12px;
      border-radius: 0 8px 8px 0;
      margin: 0.5rem 0;
    }
    .concept-wrap details {
      margin-bottom: 10px;
      border: 1px solid var(--color-border-tertiary);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }
    .concept-wrap summary {
      cursor: pointer;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 12px 14px;
      background: linear-gradient(135deg, #f0f9ff 0%, #f1f5f9 100%);
      color: #0369a1;
      list-style: none;
    }
    .concept-wrap summary::-webkit-details-marker { display: none; }
    .concept-wrap details[open] summary {
      border-bottom: 1px solid var(--color-border-tertiary);
    }
    .concept-wrap .concept-details-body {
      padding: 12px 14px 14px;
    }
    .concept-wrap table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      margin: 0.5rem 0;
    }
    .concept-wrap th,
    .concept-wrap td {
      border: 1px solid var(--color-border-tertiary);
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }
    .concept-wrap th {
      background: #f1f5f9;
      font-weight: 700;
      color: #334155;
    }
    .concept-wrap details.concept-chapter {
      margin-bottom: 12px;
      border-width: 2px;
      border-color: rgba(2, 132, 199, 0.2);
    }
    .concept-wrap details.concept-chapter > summary {
      font-size: 0.95rem;
      padding: 14px 16px;
    }
    .concept-wrap details.concept-nested {
      margin: 0 0 8px 4px;
      border: 1px solid #e9d5ff;
      border-radius: 10px;
      background: #fdfcff;
    }
    .concept-wrap details.concept-nested > summary {
      font-size: 0.84rem;
      font-weight: 700;
      padding: 10px 12px;
      background: linear-gradient(135deg, #f0f9ff 0%, #f8fafc 100%);
      color: #0284c7;
    }
    .concept-wrap details.concept-nested[open] > summary {
      border-bottom: 1px solid #e0f2fe;
    }
    .concept-wrap details.concept-nested .concept-details-body {
      padding: 10px 12px 12px;
      font-size: 0.86rem;
    }
    .concept-wrap details.concept-chapter > .concept-details-body > .concept-chapter-hint {
      font-size: 0.8rem;
      color: var(--color-text-secondary);
      margin: 0 0 10px;
      padding: 0 2px;
    }
  </style>
</head>
<body>
<template id="econ-ref-snippets">
<div data-econ-ref="경제개요"><h3>경제학 개요</h3><ul><li>희소성·선택, 생산·분배·소비, 사회과학으로서 경제학.</li><li>가계·기업·정부·해외 네 주체와 목표.</li></ul></div>
<div data-econ-ref="가계"><h3>가계</h3><ul><li>효용 극대화, 생산물 시장에서는 수요, 요소 시장에서는 공급(노동 등).</li><li>합리적 소비: 한계효용·기회비용·시간 제약.</li></ul></div>
<div data-econ-ref="기업"><h3>기업</h3><ul><li>이윤 극대화, 재화·서비스 공급, 생산요소 수요, 납세.</li><li>기업가 정신, 슘페터의 창조적 파괴(혁신), 사회적 책임.</li></ul></div>
<div data-econ-ref="정부"><h3>정부</h3><ul><li>사회후생·형평·효율, 세입·세출·예산(편성→국회→집행→결산).</li><li>시장 실패 보완, 재분배, 성장·안정(확대·긴축 재정), 조세의 기능·역기능.</li></ul></div>
<div data-econ-ref="해외"><h3>해외(외국)</h3><ul><li>무역·투자 등 대외 관계, 교과서적 네 번째 경제 주체.</li></ul></div>
<div data-econ-ref="재화서비스"><h3>재화·서비스</h3><ul><li>자유재 vs 경제재, 소비재·생산재, 용역(서비스)의 대가.</li></ul></div>
<div data-econ-ref="희소성3대"><h3>희소성·3대 문제·효율·형평</h3><ul><li>What·How·For whom, 효율 vs 형평 논의.</li></ul></div>
<div data-econ-ref="기회비용"><h3>기회비용·매몰비용</h3><ul><li>포기한 차선 대안 중 최대가치, 명시적+암묵적 비용.</li><li>매몰비용은 회수 불가·새 결정에서 보통 제외.</li></ul></div>
<div data-econ-ref="PPF"><h3>생산가능곡선(PPF)</h3><ul><li>트레이드오프, 오목=기회비용 체증, 바깥 이동=기술·자원.</li></ul></div>
<div data-econ-ref="유인"><h3>합리적 선택·효율·유인</h3><ul><li>최대효과·최소비용, 긍정·부정 유인(장학금·과태료 등).</li></ul></div>
<div data-econ-ref="경제체제"><h3>경제 체제·스미스·분업·무역</h3><ul><li>전통·계획·시장·혼합, 보이지 않는 손·가격기구.</li><li>분업·절대·비교우위, 자본주의 단계·대공황·케인즈·스태그플레이션.</li></ul></div>
<div data-econ-ref="분업무역"><h3>분업·무역</h3><ul><li>사회적·기술적 분업, 비교우위·교환비율, 분업의 부작용.</li></ul></div>
<div data-econ-ref="가격기구"><h3>시장·가격기구</h3><ul><li>신호·유인·정보, 스미스의 보이지 않는 손.</li></ul></div>
<div data-econ-ref="수요공급"><h3>수요·공급</h3><ul><li>법칙, 수요(량)의 변동 vs 변화, 정상·열등·대체·보완.</li></ul></div>
<div data-econ-ref="시장균형"><h3>시장 균형</h3><ul><li>초과수요→가격 상승, 초과공급→하락, 동시 이동 시 불분명 가능.</li></ul></div>
<div data-econ-ref="탄력성"><h3>탄력성</h3><ul><li>가격·소득·교차·공급 탄력, 총매출과 Ed, 농산물·기간.</li></ul></div>
<div data-econ-ref="잉여"><h3>잉여·효율·독점</h3><ul><li>소비자·생산자 잉여, 완전경쟁 총잉여, 독점 시 데드웨이트.</li></ul></div>
<div data-econ-ref="가격통제"><h3>가격 통제</h3><ul><li>상한·초과수요·품질·암시장, 하한·초과공급·실업, 농업 파동.</li></ul></div>
<div data-econ-ref="시장실패"><h3>시장 실패</h3><ul><li>독과점·외부성·공공재·정보 비대칭, 정부 개입 수단.</li></ul></div>
<div data-econ-ref="정부재정"><h3>정부·재정·조세</h3><ul><li>세입·세출, 직접·간접·누진·비례·역진, 확대·긴축 재정, 재정 건전성·민주주의.</li></ul></div>

function hardFifthDistractor(q){

  const arr=Array.isArray(pool)?pool:HARD_TRAP_FALLBACK;
  let i=(q.id*17+q.cat.length)%arr.length;let s=arr[i];let guard=0;
  while((s===q.a||q.opts.includes(s))&&guard<16){i=(i+1)%arr.length;s=arr[i];guard++}
  if(guard>=16)return "문항과 무관하게 ‘항상·절대’로 단정하는 설명";
  return s;
}

function mergeEconomProg(raw){
  const o=defaultEconomProg();
  if(!raw||typeof raw!=="object")return o;
  for(const d of ["easy","hard"]){
    const src=raw[d];
    if(!src||typeof src!=="object")continue;
    if(src.mastered&&typeof src.mastered==="object")Object.assign(o[d].mastered,src.mastered);
    if(src.wrongCnt&&typeof src.wrongCnt==="object")Object.assign(o[d].wrongCnt,src.wrongCnt);
    if(typeof src.best==="number"&&src.best>=0)o[d].best=src.best;
  }
  return o;
}

<details open class="concept-chapter"><summary>제1장 · 경제생활과 경제학</summary><div class="concept-details-body">
<p class="concept-chapter-hint">이 장을 펼치면 아래 소단원들이 나옵니다.</p>

<details open class="concept-nested"><summary>경제생활과 경제학(개요)</summary><div class="concept-details-body">
<h3>경제학이란</h3>
<ul>
<li>희소한 자원을 놓고 무엇을 어떻게 생산·분배·소비할지 선택하는 문제를 다루는 사회과학.</li>
<li>전통적으로 생산·교환·소비가 중심이었으나 범죄, 가족, 스포츠 등으로 연구 범위가 넓어지기도 함.</li>
</ul>
<h3>경제 활동</h3>
<ul>
<li><strong>생산</strong>: 가치를 창조·증대. 제조, 보관, 운반, 판매, 서비스 제공.</li>
<li><strong>분배</strong>: 생산에 대한 기여의 대가. 임금·이자·지대·이윤 등 요소소득.</li>
<li><strong>소비</strong>: 분배된 소득으로 재화·서비스를 구매해 욕구를 충족. 소득 = 소비 + 세금 + 저축, 가처분소득 = 소득 − 세금 − 필수비용(개념에 따라 표현 상이).</li>
</ul>
<h3>경제 주체(4가지)와 목표</h3>
<ul>
<li><strong>가계</strong>: 효용 극대화. 생산물 시장에서는 수요자, 요소 시장에서는 공급자.</li>
<li><strong>기업</strong>: 이윤 극대화. 생산물 시장 공급, 요소 시장 수요.</li>
<li><strong>정부</strong>: 사회후생·형평성·효율. 세입·세출·정책.</li>
<li><strong>외국(해외)</strong>: 무역·투자 등 대외 관계.</li>
</ul>
<h3>경제 객체: 재화와 서비스</h3>
<ul>
<li><strong>자유재(무상재)</strong>: 부존량이 풍부해 대가 없이 쓸 수 있어 희소성 분석에서 보통 제외.</li>
<li><strong>경제재</strong>: 대가를 지불해야 하며 희소성이 있음. 수요·공급 변화로 자유재가 경제재로 바뀔 수 있음.</li>
<li><strong>소비재 / 생산재</strong>: 용도에 따라 달라짐(예: 보리—가정 소비 vs 음료 원료).</li>
<li><strong>서비스(용역)</strong>: 진료, 연주, 노동, 도소매 등 유용한 행위. 대개 경제재처럼 대가가 붙음.</li>
</ul>
</div></details>

<details class="concept-nested"><summary>희소성 · 경제의 3대 문제 · 효율과 형평</summary><div class="concept-details-body">
<ul>
<li><strong>희소성의 법칙</strong>: 욕구는 상대적으로 크고 자원은 제한적 → 선택과 경제 문제의 근본 원인.</li>
<li><strong>경제적 자원</strong>: 넓게는 아껴 써야 할 쓸모 있는 모든 것. 좁게는 생산요소(노동, 자본, 토지, 기업가적 기능 등).</li>
<li><strong>3대 문제</strong>: 무엇을·얼마나(What), 어떻게(How), 누구에게·어떻게 분배(For whom). 해결 방식은 경제 체제에 따라 다름.</li>
<li><strong>효율성</strong>: 주어진 자원으로 후생(편익) 최대, 또는 일정 후생에 비용 최소.</li>
<li><strong>형평성</strong>: ‘공정한 분배’는 기준에 따라 논쟁. 시장은 효율에는 유리한 편이나 형평·시장 실패 보완을 위해 정부 개입 논의.</li>
</ul>
</div></details>

<details class="concept-nested"><summary>기회비용 · 매몰비용 · 생산가능곡선(PPF)</summary><div class="concept-details-body">
<ul>
<li><strong>편익·비용·순편익</strong>: 순편익 = 편익 − 비용(경제적 비용은 기회비용 관점이 중요).</li>
<li><strong>기회비용</strong>: 선택으로 포기한 차선 대안 중 가치가 가장 큰 것. 명시적 비용 + 암묵적 비용.</li>
<li><strong>매몰비용</strong>: 이미 지출되어 회수 불가한 비용. 앞으로의 합리적 선택에서는 보통 제외.</li>
<li><strong>PPF</strong>: 자원을 효율적으로 쓸 때 두 재화의 최대 조합. 우하향, 보통 원점에 대해 오목(기회비용 체증). 기술·자원 증가 시 바깥으로 이동. 안쪽은 비효율 또는 유휴.</li>
</ul>
</div></details>

<details class="concept-nested"><summary>합리적 선택 · 경제적 효율성 · 유인</summary><div class="concept-details-body">
<ul>
<li><strong>경제적 효율성</strong>: 최대효과의 원칙 + 최소비용의 원칙(동전의 양면).</li>
<li><strong>합리적 의사결정</strong>: 문제 인식 → 대안 나열 → 평가 기준 → 대안 평가 → 최종 선택.</li>
<li><strong>경제적 유인</strong>: 금전적 보상·손실로 행동을 유도. 긍정적(장학금, 보조금 등) / 부정적(과태료, 벌금 등).</li>
</ul>
</div></details>

<details class="concept-nested"><summary>경제 체제 · 시장경제의 제도 · 자본주의의 흐름</summary><div class="concept-details-body">
<h3>체제 유형</h3>
<table>
<thead><tr><th>구분</th><th>특징</th></tr></thead>
<tbody>
<tr><td>전통경제</td><td>관습·전통·종교 등에 따른 운영</td></tr>
<tr><td>계획경제</td><td>정부 명령·계획, 생산수단 국·공유에 가까움. 유인 부족·관료 오판 한계</td></tr>
<tr><td>시장경제</td><td>가격·경쟁, 사유재산·이윤 추구. 빈부격차·경기변동 한계</td></tr>
<tr><td>혼합경제</td><td>시장 틀 + 정부 개입(복지·규제). 한계: 정부 비대화, 복지병 등</td></tr>
</tbody></table>
<h3>시장경제를 뒷받침하는 제도</h3>
<ul>
<li>사유재산권, 경제활동의 자유, 공정한 경쟁의 보장.</li>
<li><strong>아담 스미스</strong>: 이기적이나 합리적 선택이 시장을 통해 사회에 이롭게 작용할 수 있다는 ‘보이지 않는 손’, 가격기구.</li>
</ul>
<h3>분업·특화·무역</h3>
<ul>
<li><strong>분업</strong>: 기술적 분업(공정 분할) vs 사회적 분업(직업·산업 분화). 생산성↑, 단 반복·지연 리스크.</li>
<li><strong>특화</strong>: 분업을 통해 특정 재화에 집중.</li>
<li><strong>절대우위</strong>: 같은 자원으로 더 많이 생산.</li>
<li><strong>비교우위</strong>: 기회비용이 상대적으로 작은 재화. 한 나라가 두 재화 모두 절대우위여도 비교우위는 나뉨. 교환비율은 양국 기회비용 사이에 있어야 무역 이익.</li>
</ul>
<h3>자본주의 단계(요약)</h3>
<ul>
<li>상업 자본주의(유통·금융 중심) → 산업 자본주의(공장·부가가치) → 독점 자본주의(대기업 지배) → 수정 자본주의·복지국가(대공황 이후 정부 역할 확대) → 신자유주의(스태그플레이션·정부실패 논의, 규제 완화·작은 정부).</li>
<li><strong>대공황(1929~)</strong>: 주가 폭락, 실업, 뉴딜 등.</li>
<li><strong>케인즈</strong>: 유효수요 부족, 재정·통화정책. 절약의 역설, 구성의 오류와 연결.</li>
<li><strong>석유파동·스태그플레이션</strong>: 유가 충격 + 침체·물가상승.</li>
</ul>
</div></details>

<details class="concept-nested"><summary>경제 주체의 역할(가계·기업·정부)</summary><div class="concept-details-body">
<h3>가계</h3>
<ul>
<li>생산물 수요, 요소 공급, 납세. 노동: 사회적·경제적 의미. 합리적 소비: 한계효용과 기회비용, 시간 제약.</li>
<li><strong>소비 이론</strong>: 절대소득(케인즈, 현재 가처분소득), 항상소득, 생애주기, 상대소득(전시·톱니 효과 등), 소비의 비가역성.</li>
<li><strong>비합리적 소비</strong>: 편승, 스노브(백워), 베블렌, 의존, 가수요 등.</li>
</ul>
<h3>기업</h3>
<ul>
<li>생산물 공급, 요소 수요, 납세. 기업가 정신, 슘페터의 창조적 파괴(혁신), 사회적 책임.</li>
</ul>
<h3>정부</h3>
<ul>
<li>재정: 세입(조세·수수료 등) vs 세출. 예산: 편성 → 국회 심의·확정 → 집행 → 결산·감사.</li>
<li>역할: 효율적 자원배분(경쟁 촉진, 시장 실패 보완), 소득재분배, 성장·안정(확대/긴축 재정).</li>
<li>고려: 효율·형평, 재정 건전성, 재정 민주주의.</li>
<li><strong>조세</strong>: 재원, 자원배분(유류세·감면 등), 재분배(누진세). 역기능: 근로·투자 의욕, 수요 위축 가능.</li>
<li><strong>직접세 vs 간접세</strong>, 누진·비례·역진(간접세 비례 시 부담 역진성), 초과 누진세율(구간별 순차 적용).</li>
</ul>
</div></details>

<details class="concept-nested"><summary>인구·고령화(UN 기준)</summary><div class="concept-details-body">
<ul>
<li><strong>고령화 사회</strong>: 65세 이상 7% 이상.</li>
<li><strong>고령 사회</strong>: 14% 이상.</li>
<li><strong>초고령 사회</strong>: 20% 이상.</li>
<li>영향: 출산율 감소, 노동력·부양, 의료·연금 부담 등.</li>
</ul>
</div></details>

</div></details>

<details class="concept-chapter"><summary>제2장 · 시장과 경제 활동</summary><div class="concept-details-body">
<p class="concept-chapter-hint">이 장을 펼치면 아래 소단원들이 나옵니다.</p>

<details class="concept-nested"><summary>시장의 의미·기능 · 가격기구</summary><div class="concept-details-body">
<ul>
<li>수요자와 공급자가 거래하는 장소·관계(구체적·추상적 시장).</li>
<li>기능: 거래비용 감소, 분업·특화 촉진, 가격 형성을 통한 정보·자원 배분.</li>
<li><strong>가격기구</strong>: 신호, 유인, 정보 전달(스미스의 보이지 않는 손과 연결).</li>
</ul>
</div></details>

<details class="concept-nested"><summary>수요·공급</summary><div class="concept-details-body">
<ul>
<li><strong>수요법칙·공급법칙</strong>: 다른 조건 불변(ceteris paribus) 하에서 가격과 수요량은 부(−), 가격과 공급량은 정(+).</li>
<li><strong>수요량의 변동</strong> vs <strong>수요의 변동</strong>(가격 외 요인으로 곡선 이동). 공급도 동일.</li>
<li><strong>정상재·열등재</strong>, <strong>대체재·보완재</strong>, <strong>유량·저량</strong>(GDP·소득은 유량, 재산은 저량).</li>
</ul>
</div></details>

<details class="concept-nested"><summary>시장 균형</summary><div class="concept-details-body">
<ul>
<li>수요량=공급량인 균형가격·균형거래량. 초과수요→가격 상승 압력, 초과공급→하락 압력.</li>
<li>수요·공급이 동시에 변하면 균형가격은 불분명할 수 있음.</li>
</ul>
</div></details>

<details class="concept-nested"><summary>탄력성</summary><div class="concept-details-body">
<ul>
<li><strong>가격탄력성</strong>: Ed>1 탄력(사치에 가까움), 0&lt;Ed&lt;1 비탄력(필수에 가까움), Ed=0 완전비탄력, Ed=∞ 완전탄력.</li>
<li>총매출(가격×수량)과 Ed 관계: 탄력적이면 가격↑→매출↓ 경향 등.</li>
<li><strong>소득탄력성</strong>: 음수 열등재, 0~1 필수적 정상재, 1 초과 사치.</li>
<li><strong>교차탄력성</strong>: 대체재는 양(+), 보완재는 음(−).</li>
<li><strong>공급의 가격탄력성</strong>: 기간·저장·생산 유연성. 농산물은 단기 비탄력적이기 쉬움.</li>
</ul>
</div></details>

<details class="concept-nested"><summary>잉여 · 효율 · 가격 통제</summary><div class="concept-details-body">
<ul>
<li><strong>소비자 잉여</strong>: 지불 의사 − 실제 지불. <strong>생산자 잉여</strong>: 실제 수취 − 최소 수취 의사.</li>
<li>경쟁 시장 균형에서 총잉여 최대(외부성 등 없을 때).</li>
<li><strong>최고가격제(상한)</strong>: 균형보다 낮으면 초과수요, 암시장, 품질저하, 후생손실.</li>
<li><strong>최저가격제(하한)</strong>: 농산물 지지, 최저임금 등 → 초과공급(잉여농산물, 실업 가능성).</li>
<li><strong>농산물</strong>: 수요·공급이 비탄력 → 가격 파동. 이중가격제는 재정 부담.</li>
</ul>
</div></details>

<details class="concept-nested"><summary>생산요소 시장</summary><div class="concept-details-body">
<ul>
<li><strong>노동시장</strong>: 노동 수요·공급으로 임금 결정.</li>
<li><strong>금융시장</strong>: 저축·잉여자금 공급, 투자 등 수요 → 이자율. 침체 시 투자 감소 → 금리 하락 압력 등.</li>
</ul>
</div></details>

<details class="concept-nested"><summary>시장 실패와 정부</summary><div class="concept-details-body">
<ul>
<li>독과점·과점, 외부효과(불경제=과다, 경제=과소), 공공재, 정보 비대칭 등.</li>
<li>정부 개입: 규제, 세금·보조금, 공공재 공급 등(목표와 비용 트레이드오프).</li>
</ul>
</div></details>

</div></details>

<p class="concept-note" style="margin-top:1rem">퀴즈 문항의 카테고리 이름과 대응해 두었습니다. 암기보다는 용어 관계(무엇이 원인·무엇이 결과인지)를 함께 읽으면 풀이에 도움이 됩니다.</p>
</div>`;
}

function render(){
  bindEconTabs();
  if(S.topView==="concepts"){renderConcepts();return;}
  if(S.phase==="menu")renderMenu();
  else if(S.phase==="review")renderReview();
  else renderQuiz();
}

function renderMenu(){
  const te=tM_diff("easy"),pe=tP_diff("easy"),th=tM_diff("hard"),ph=tP_diff("hard"),wk=weakCats(),wqs=wrongQs();
  const diffLabel=S.difficulty==="hard"?"어려운 난이도":"쉬운 난이도";
  let h=`<p style="text-align:center;font-size:14px;color:#666;line-height:1.65;margin:0 0 14px">${Q.length}문제 · 즉시 피드백·해설 · 틀리면 맨 뒤로 재배치 · 난이도별 진행도는 따로 저장됩니다. 진행도는 이 브라우저에 기억되어 새로고침해도 유지되며, 아래 초기화 버튼으로만 삭제할 수 있습니다.</p>
  <div class="diff-pick">
    <button type="button" class="btn ${S.difficulty==="easy"?"btn--on":""}" onclick="S.difficulty='easy';render()">쉬운 난이도<small>기본 4지선다</small></button>
    <button type="button" class="btn ${S.difficulty==="hard"?"btn--on":""}" onclick="S.difficulty='hard';render()">어려운 난이도<small>5지선다 · 교란 보기 1</small></button>
  </div>
  <div class="progress-box">
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px"><span style="font-weight:500;color:var(--color-text-primary)">쉬움 진행</span><span style="color:var(--color-text-secondary)">${te}/${Q.length} (${pe}%)</span></div>
    <div class="bar"><div class="bar-fill" style="width:${pe}%;background:${pe===100?'var(--color-text-success)':'var(--color-text-info)'}"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:12px;margin:10px 0 5px"><span style="font-weight:500;color:var(--color-text-primary)">어려움 진행</span><span style="color:var(--color-text-secondary)">${th}/${Q.length} (${ph}%)</span></div>
    <div class="bar"><div class="bar-fill" style="width:${ph}%;background:${ph===100?'var(--color-text-success)':'#c2410c'}"></div></div>
    ${curProg().best>0?`<div style="font-size:10px;color:var(--color-text-tertiary);margin-top:6px">선택 중 <strong>${esc(diffLabel)}</strong> · 최고 연속 정답: ${curProg().best}</div>`:""}
  </div>`;

  if(wk.length>0){h+=`<div class="weak-box"><div style="font-size:11px;font-weight:500;color:var(--color-text-warning);margin-bottom:3px">취약 영역</div>${wk.map(([c,v])=>`<div style="font-size:11px;color:var(--color-text-secondary)">${esc(c)} — 오답 ${v.w}회/${v.t}문제</div>`).join("")}</div>`}
  if(wqs.length>0){h+=`<button class="btn review-btn" onclick="rev()">오답 플래시카드 복습 (${wqs.length}문제)</button>`}

  h+=`<button class="btn btn-main" onclick="go(null)">${mCnt()===0?"학습 시작":"이어서 풀기"} (${esc(diffLabel)}) — ${filt().length-mCnt()}문제 남음</button>
  <div style="font-size:13px;font-weight:700;color:#0284c7;margin-bottom:10px">카테고리별</div>`;

  CATS.forEach(c=>{const s=catSt(c);
    h+=`<button class="btn cat-btn" onclick="go('${esc(c)}')"><span style="color:${s.p===100?'var(--color-text-success)':'var(--color-text-primary)'}">${esc(c)}</span><span style="display:flex;align-items:center;gap:5px"><span style="color:var(--color-text-tertiary);font-size:10px">${s.m}/${s.t}</span><span class="cat-bar"><span class="cat-bar-fill" style="width:${s.p}%;background:${s.p===100?'var(--color-text-success)':'var(--color-text-info)'}"></span></span></span></button>`});

  const anyEconomProg=tM_diff("easy")+tM_diff("hard")>0||Object.keys(S.prog.easy.wrongCnt).length+Object.keys(S.prog.hard.wrongCnt).length>0;
  if(anyEconomProg){
    h+=`<div style="margin-top:18px;display:flex;flex-direction:column;gap:8px;align-items:stretch;max-width:320px;margin-left:auto;margin-right:auto">`;
    if(mCnt()>0||Object.keys(curProg().wrongCnt).length)h+=`<button type="button" onclick="rst()" style="padding:10px 20px;border:none;border-radius:8px;background:#888;color:#fff;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600">${esc(diffLabel)} 진행도 초기화</button>`;
    h+=`<button type="button" onclick="rstAll()" style="padding:10px 20px;border:none;border-radius:8px;background:#b45309;color:#fff;cursor:pointer;font-size:12px;font-family:inherit;font-weight:600">쉬움·어려움 전체 진행도 초기화</button></div>`;
  }
  app.innerHTML=h;
}

function renderReview(){
  const wqs=wrongQs();const rq=wqs[S.revIdx];
  if(!rq){app.innerHTML=`<div style="text-align:center;padding:2rem 0"><p style="font-size:13px;color:var(--color-text-secondary)">복습할 오답이 없습니다.</p><button class="btn" style="width:auto;display:inline-block;margin-top:10px;padding:8px 18px" onclick="toMenu()">메뉴로</button></div>`;return}

  let h=`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><button class="link-btn" onclick="toMenu()">← 메뉴</button><span style="font-size:10px;color:var(--color-text-tertiary)">${S.revIdx+1}/${wqs.length}</span></div>
  <div style="font-size:10px;color:var(--color-text-warning);margin-bottom:5px">오답 ${curProg().wrongCnt[rq.id]}회 — ${esc(rq.cat)}</div>
  <div class="card" onclick="S.showCard=!S.showCard;render()">`;

  if(!S.showCard){h+=`<div style="font-size:14px;font-weight:500;color:var(--color-text-primary);line-height:1.6;margin-bottom:6px">${esc(rq.q)}</div><div style="font-size:10px;color:var(--color-text-tertiary)">탭하여 정답 보기</div>`}
  else{h+=`<div style="font-size:10px;font-weight:600;color:var(--color-text-tertiary);margin-bottom:4px">관련 개념(단원)</div><div style="font-size:12px;font-weight:600;color:var(--color-text-primary);margin-bottom:10px">${esc(rq.cat)}</div><div style="font-size:14px;font-weight:500;color:var(--color-text-success);line-height:1.6;margin-bottom:6px">${esc(rq.a)}</div><div style="font-size:11px;color:var(--color-text-secondary);line-height:1.6"><strong style="color:var(--color-text-primary)">해설·풀이</strong> — ${esc(rq.ex)}</div>`}

  h+=`</div><div style="display:flex;gap:6px;margin-top:12px">
  <button class="btn" style="flex:1;text-align:center;${S.revIdx===0?'color:var(--color-text-tertiary);cursor:default':''}" ${S.revIdx===0?'disabled':''} onclick="S.revIdx--;S.showCard=false;render()">← 이전</button>
  <button class="btn" style="flex:1;text-align:center;font-weight:500;border-color:var(--color-border-secondary)" onclick="${S.revIdx<wqs.length-1?'S.revIdx++;S.showCard=false;render()':'toMenu()'}">${S.revIdx<wqs.length-1?"다음 →":"완료"}</button></div>`;
  app.innerHTML=h;
}

function renderQuiz(){
  const cur=S.lockedQ,P=curProg();const unmast=filt().filter(q=>!P.mastered[q.id]).length;const done=!cur&&unmast===0;const p=pct();const mc=mCnt();const fl=filt().length;
  const rate=S.sess.c+S.sess.w>0?Math.round(S.sess.c/(S.sess.c+S.sess.w)*100):0;
  const diffTag=S.difficulty==="hard"?"어려움 · 5지선다":"쉬움 · 4지선다";

  let h=`<div class="header"><button class="link-btn" onclick="toMenu()">← 메뉴</button><div style="display:flex;gap:10px;font-size:10px;color:var(--color-text-tertiary)"><span id="econ-quiz-timer">${fmt(S.timer)}</span>${S.streak>=3?`<span style="color:var(--color-text-warning);font-weight:500">연속 ${S.streak}정답!</span>`:""}</div></div>
  <div class="meta"><span>${esc(S.catF||"전체")}</span><span>${mc}/${fl} 마스터 · 정답률 ${rate}% · <span style="color:var(--color-text-info);font-weight:600">${esc(diffTag)}</span></span></div>
  <div class="bar bar-sm"><div class="bar-fill" style="width:${p}%;background:${p===100?'var(--color-text-success)':'var(--color-text-info)'}"></div></div>`;

  if(done){
    h+=`<div style="text-align:center;padding:40px 12px"><div style="font-size:48px;margin-bottom:8px;color:#4CAF50;line-height:1">&#10003;</div><h3 style="font-size:1.35em;font-weight:700;color:#0284c7;margin:0 0 10px">${esc(S.catF||"전체")} 완료! <span style="font-size:0.75em;font-weight:600;color:#666">(${S.difficulty==="hard"?"어려움":"쉬움"})</span></h3><p style="font-size:1.05em;color:#666;margin:0 0 6px">${S.sess.c}정답 / ${S.sess.w}오답 · ${fmt(S.timer)}</p>${S.sess.w>0?`<p style="font-size:0.95em;color:#e65100;margin-bottom:4px">오답 ${S.sess.w}문제 → 메뉴에서 복습 가능</p>`:""}<button class="btn btn-next" style="margin-top:18px" onclick="toMenu()">메뉴로</button></div>`;
  } else if(cur){
    h+=`<div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:10px;color:var(--color-text-tertiary)">${esc(cur.cat)}</span>${P.wrongCnt[cur.id]>0&&S.sel===null?`<span style="font-size:10px;color:var(--color-text-warning)">이전 오답 ${P.wrongCnt[cur.id]}회</span>`:""}</div>
    <h3 style="font-size:14px;font-weight:500;color:var(--color-text-primary);margin:0 0 14px;line-height:1.6">${esc(cur.q)}</h3>
    <div style="display:flex;flex-direction:column;gap:5px">`;

    S.lockedOpts.forEach((o,i)=>{
      const isA=o===cur.a,isS=o===S.sel;
      let cls="",lbl="",extra="";
      if(S.sel!==null){
        if(isA){cls="bg-ok";lbl="정답";extra="color:var(--color-text-success)"}
        else if(isS&&!isA){cls="bg-err";lbl="오답";extra="color:var(--color-text-danger)"}
        else{extra="color:var(--color-text-tertiary)"}
      }
      const pad=`padding-left:48px;${lbl?"padding-right:52px":""}`;
      h+=`<button type="button" class="btn ${cls}" ${S.sel!==null?"disabled":""} onclick="pick('${o.replace(/'/g,"\\'")}')" style="${extra};${pad}"><span class="opt-num" aria-hidden="true">${i+1}</span>${esc(o)}${lbl?`<span class="opt-label">${lbl}</span>`:""}</button>`;
    });
    h+=`</div>`;

    if(S.sel!==null){
      const exHtml=cur.ex?esc(cur.ex):"(이 문항에는 별도 해설이 없습니다.)";
      h+=`<div style="margin-top:10px">`;
      if(S.sel!==cur.a){
        h+=`<div class="wrong-learn-box" style="padding:10px 14px 14px;border-radius:12px;border:1px solid rgba(244,67,54,0.35);background:linear-gradient(135deg,#fff8f8 0%,#ffebee 100%);box-shadow:0 2px 10px rgba(244,67,54,0.08);margin-bottom:10px">
              <div style="margin-bottom:10px">
                <div style="font-size:10px;font-weight:600;color:var(--color-text-tertiary);margin-bottom:4px">관련 개념(단원)</div>
                <div style="font-size:14px;font-weight:600;color:var(--color-text-primary)">${esc(cur.cat)}</div>
              </div>
              <div style="margin-bottom:10px">
                <div style="font-size:10px;font-weight:600;color:var(--color-text-tertiary);margin-bottom:4px">정답</div>
                <div style="font-size:14px;font-weight:600;color:#1b5e20">${esc(cur.a)}</div>
              </div>
              <div style="margin-bottom:10px">
                <div style="font-size:10px;font-weight:600;color:var(--color-text-tertiary);margin-bottom:4px">해설·문제 풀이</div>
                <div style="font-size:12px;color:#444;line-height:1.65">${exHtml}</div>
              </div>
              ${buildEconWrongRefTabsHtml(cur.cat)}
        </div>
        <div style="font-size:11px;color:var(--color-text-danger);margin-bottom:8px">이 문제는 대기열 맨 뒤로 보내져, 다른 문제를 먼저 풉니다.</div>`;
      }else{
        h+=`<div class="ex-box"><div style="font-size:10px;font-weight:600;color:var(--color-text-tertiary);margin-bottom:6px">해설</div><div style="font-size:11px;color:var(--color-text-secondary);line-height:1.6">${exHtml}</div></div>`;
      }
      h+=`<button class="btn btn-next" onclick="nxt()">다음 →</button></div>`;
    }
  } else {
    h+=`<div style="text-align:center;padding:24px 0;color:var(--color-text-tertiary);font-size:12px">불러오는 중...</div>`;
  }
  app.innerHTML=h;
}

document.addEventListener("keydown",function(ev){
  if(ev.target&&["INPUT","TEXTAREA","SELECT"].includes(ev.target.tagName))return;
  if(ev.target&&ev.target.isContentEditable)return;
  if(S.topView!=="quiz")return;
  if(ev.key==="Enter"&&S.phase==="quiz"&&S.sel!==null&&S.lockedQ){
    ev.preventDefault();
    nxt();
    return;
  }
  if(S.phase!=="quiz"||S.sel!==null||!S.lockedQ||!S.lockedOpts.length)return;
  const m=/^(?:Digit|Numpad)([1-9])$/.exec(ev.code);
  if(!m)return;
  const idx=Number(m[1])-1;
  if(idx>=S.lockedOpts.length)return;
  ev.preventDefault();
  pick(S.lockedOpts[idx]);
});

render();
</script>

  <script src="ai-quiz-subjects.js"></script>

  <script src="bgm-player.js" defer></script>
