<!DOCTYPE html>
<html lang="ko">
<head>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      padding: clamp(16px, 4vw, 28px) 16px 100px;
      min-height: 100vh;
      }
    
    .app-title {
      text-align: center;
      
      margin-bottom: clamp(18px, 4vw, 26px);
      font-size: clamp(1.5rem, 4.5vw, 2.1rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.2;
      
    }
    .page-card {
      background: rgba(255, 255, 255, 0.98);
      border-radius: 24px;
      padding: clamp(32px, 5vw, 48px) clamp(22px, 4vw, 40px);
      max-width: 720px;
      margin: 0 auto 72px;
      box-shadow:
        0 4px 6px -1px rgba(15, 23, 42, 0.06),
        0 24px 48px -12px rgba(14, 165, 233, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }
    .wrap { max-width: 100%; margin: 0 auto; padding: 0; }

    :root {
      --color-text-primary: #333;
      --color-text-secondary: #666;
      --color-text-tertiary: #999;
      --color-text-success: #4caf50;
      --color-text-info: #0ea5e9;
      --color-text-warning: #e65100;
      --color-text-danger: #f44336;
      --color-background-primary: #fff;
      --color-background-secondary: #f5f7fa;
      --color-border-tertiary: #e0e0e0;
      --color-border-secondary: #d0d0d0;
      --color-background-success: #e8f5e9;
      --color-border-success: #81c784;
      --color-background-danger: #ffebee;
      --color-border-danger: #ef9a9a;
      --color-background-warning: #fff8e1;
      --color-border-warning: #ffe082;
    }

    .bar { height: 8px; background: var(--sky-100);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 8px;
      transition: width 0.3s ease;
      background: linear-gradient(90deg, #0ea5e9, #0284c7);
    }
    .bar-sm { height: 5px; margin-bottom: 18px; }

    .btn {
      display: block;
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      font-size: 0.95em;
      color: #333;
      text-align: left;
      line-height: 1.5;
      transition: all 0.3s ease;
      position: relative;
      font-family: inherit;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
    }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled {
      cursor: default;
      opacity: 0.65;
      transform: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .btn-main {
      padding: 16px 18px;
      font-size: 1.1em;
      font-weight: 700;
      margin-bottom: 16px;
      text-align: center;
      color: var(--sky-600);
      background: var(--sky-100);
      border: 1px solid var(--sky-200);
      box-shadow: none;
    }
    .btn-main:hover:not(:disabled) {
      background: var(--sky-200);
      border-color: var(--sky-300);
    }

    .btn-next {
      display: inline-block;
      width: auto;
      padding: 12px 32px;
      font-size: 1.05em;
      font-weight: 700;
      text-align: center;
      color: var(--sky-600);
      background: var(--sky-100);
      border: 1px solid var(--sky-200);
      box-shadow: none;
    }
    .btn-next:hover:not(:disabled) {
      background: var(--sky-200);
      border-color: var(--sky-300);
    }

    .cat-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      font-size: 0.92em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      color: #333;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .cat-bar {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 4px;
      display: inline-block;
      position: relative;
      vertical-align: middle;
    }
    .cat-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #0ea5e9, #0284c7);
    }

    .opt-num {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 26px;
      height: 26px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8em;
      font-weight: 800;
      background: rgba(14, 165, 233, 0.14);
      color: #0284c7;
      flex-shrink: 0;
    }
    .btn.bg-ok .opt-num { background: rgba(76, 175, 80, 0.2); color: var(--color-text-success); }
    .btn.bg-err .opt-num { background: rgba(244, 67, 54, 0.15); color: var(--color-text-danger); }

    .opt-label {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.75em;
      font-weight: 700;
    }

    .weak-box {
      background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
      border: 1px solid #ffe082;
      border-radius: 15px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(230, 81, 0, 0.1);
    }

    .review-btn {
      margin-bottom: 8px;
      text-align: center;
      color: #c2410c;
      font-weight: 700;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      box-shadow: none;
    }

    .card {
      background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf4 100%);
      border-radius: 15px;
      padding: 24px;
      cursor: pointer;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .ex-box {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #e0e0e0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .wrong-ref-wrap { margin-top: 10px; }
    .wrong-ref-intro {
      font-size: 11px;
      color: var(--color-text-secondary);
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .wrong-ref-tab {
      margin-bottom: 8px;
      border: 1px solid var(--color-border-tertiary);
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
    }
    .wrong-ref-tab > summary {
      cursor: pointer;
      list-style: none;
      font-weight: 700;
      font-size: 12px;
      padding: 10px 12px;
      background: linear-gradient(135deg, #f0f9ff 0%, #f1f5f9 100%);
      color: #0369a1;
      user-select: none;
    }
    .wrong-ref-tab > summary::-webkit-details-marker { display: none; }
    .wrong-ref-tab > summary::marker { content: ""; }
    .wrong-ref-tab[open] > summary { border-bottom: 1px solid var(--color-border-tertiary); }
    .wrong-ref-tab-body { padding: 10px 12px 12px; font-size: 0.86rem; line-height: 1.55; color: var(--color-text-primary); }

    .link-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.95em;
      color: #0ea5e9;
      font-weight: 600;
      padding: 4px 0;
      font-family: inherit;
      transition: color 0.2s ease;
    }
    .link-btn:hover { text-decoration: underline; color: #0284c7; }

    .progress-box {
      background: #f5f7fa;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.82em;
      color: #999;
      margin-bottom: 6px;
    }

    .c-ok { color: #4caf50; }
    .c-info { color: #0ea5e9; }
    .c-warn { color: #e65100; }
    .c-err { color: #f44336; }

    .bg-ok {
      background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%) !important;
      border: 2px solid #4caf50 !important;
      color: #1b5e20 !important;
      box-shadow: 0 2px 12px rgba(76, 175, 80, 0.25) !important;
    }
    .bg-err {
      background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%) !important;
      border: 2px solid #f44336 !important;
      color: #b71c1c !important;
      box-shadow: 0 2px 12px rgba(244, 67, 54, 0.2) !important;
    }

    .hist-topnav {
      display: flex;
      gap: 8px;
      margin: -8px 0 20px;
      padding: 6px;
      background: linear-gradient(135deg, #f1f5f9 0%, #e8e0f7 100%);
      border-radius: 14px;
      border: 1px solid rgba(2, 132, 199, 0.12);
    }
    .hist-topnav__btn {
      flex: 1;
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      color: #0284c7;
      background: transparent;
      transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }
    .hist-topnav__btn:hover { background: rgba(255, 255, 255, 0.65); }
    .hist-topnav__btn.is-on {
      color: #fff;
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      box-shadow: 0 4px 14px rgba(102, 126, 234, 0.4);
    }

    .concept-wrap {
      color: var(--color-text-primary);
      font-size: 0.9rem;
      line-height: 1.65;
    }
    .concept-wrap h3 {
      font-size: 0.88rem;
      font-weight: 700;
      color: #0284c7;
      margin: 1rem 0 0.35rem;
    }
    .concept-wrap h3:first-child { margin-top: 0; }
    .concept-wrap ul { margin: 0.25rem 0 0.75rem 1.1rem; padding: 0; }
    .concept-wrap li { margin-bottom: 0.35rem; }
    .concept-wrap .concept-note {
      font-size: 0.82rem;
      color: var(--color-text-secondary);
      background: #f8fafc;
      border-left: 3px solid #bae6fd;
      padding: 10px 12px;
      border-radius: 0 8px 8px 0;
      margin: 0.5rem 0;
    }
    .concept-wrap details {
      margin-bottom: 10px;
      border: 1px solid var(--color-border-tertiary);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }
    .concept-wrap summary {
      cursor: pointer;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 12px 14px;
      background: linear-gradient(135deg, #f0f9ff 0%, #f1f5f9 100%);

      list-style: none;
    }
    .concept-wrap summary::-webkit-details-marker { display: none; }
    .concept-wrap details[open] summary { border-bottom: 1px solid var(--color-border-tertiary); }
    .concept-wrap .concept-details-body { padding: 12px 14px 14px; }
    .concept-wrap table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      margin: 0.5rem 0;
    }
    .concept-wrap th,
    .concept-wrap td {
      border: 1px solid var(--color-border-tertiary);
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }
    .concept-wrap th { background: #f1f5f9; font-weight: 700; color: #334155; }
    .concept-wrap details.concept-chapter {
      margin-bottom: 12px;
      border-width: 2px;
      border-color: rgba(2, 132, 199, 0.2);
    }
    .concept-wrap details.concept-chapter > summary { font-size: 0.95rem; padding: 14px 16px; }
    .concept-wrap details.concept-nested {
      margin: 0 0 8px 4px;
      border: 1px solid #e9d5ff;
      border-radius: 10px;
      background: #fdfcff;
    }
    .concept-wrap details.concept-nested > summary {
      font-size: 0.84rem;
      font-weight: 700;
      padding: 10px 12px;
      background: linear-gradient(135deg, #f0f9ff 0%, #f8fafc 100%);
      color: #0284c7;
    }
    .concept-wrap details.concept-nested[open] > summary { border-bottom: 1px solid #e0f2fe; }
    .concept-wrap details.concept-nested .concept-details-body { padding: 10px 12px 12px; font-size: 0.86rem; }
    .concept-wrap .concept-chapter-hint {
      font-size: 0.8rem;
      color: var(--color-text-secondary);
      margin: 0 0 10px;
      padding: 0 2px;
    }
  </style>
</head>

<template id="histConceptTpl">
<div class="concept-wrap">
<p class="concept-note">이 자료는 본 페이지 <strong>고려 통사·제도·문화</strong> 퀴즈 범위에 맞춰 정리했습니다. 먼저 <strong>큰 제목(제○부)</strong>을 펼친 뒤, 안의 소단원을 펼쳐 보세요.</p>

<details class="concept-chapter" open><summary>제1부 · 후삼국 분열과 고려 건국·태조</summary><div class="concept-details-body">
<p class="concept-chapter-hint">통일 전 압축 성장과 왕건의 통합 전략.</p>
<details class="concept-nested" open><summary>후삼국의 성립과 배경</summary><div class="concept-details-body">
<ul>
<li><strong>배경</strong>: 신라 하대 중앙 통제력 약화, 지방 <strong>호족</strong>의 군사·경제력 성장, 곡창·사병의 사유화.</li>
<li><strong>후백제</strong>(900): <strong>견훤</strong>(신라 군인 출신), 도읍 <strong>완산주</strong>(전주 일대).</li>
<li><strong>후고구려→태봉</strong>(901): <strong>궁예</strong>(신라 왕족), 송악 건국 → 905 <strong>철원 천도</strong> → 국호 <strong>마진</strong>→<strong>태봉</strong>.</li>
<li><strong>고려</strong>: 918 왕건이 궁예를 몰아내고 즉위, 919 <strong>개경 천도</strong>.</li>
<li><strong>고려의 대외 태도</strong>: <strong>발해 유민 적극 포용</strong>, 신라와 <strong>친선·우호</strong>, 후백제와 <strong>대립·경쟁</strong>.</li>
<li><strong>통일 순서</strong>: 견훤 아들에게 쫓겨 <strong>귀순</strong> → 신라 <strong>경순왕 자발적 귀부</strong>(935) → <strong>후백제 정벌</strong>(936)로 통일 완성.</li>
</ul>
</div></details>
<details class="concept-nested"><summary>태조 왕건의 호족 정책</summary><div class="concept-details-body">
<ul>
<li><strong>당근</strong>: <strong>혼인 정책</strong>(호족과 정략결혼·29부인·자녀 다수→이후 왕위 계쟁), <strong>사성</strong>(왕씨 성 하사).</li>
<li><strong>채찍</strong>: <strong>기인</strong>(호족 자제를 개경에 인질 격 체류), <strong>사심관</strong>(출신 고을에 중앙 관리 파견·감시).</li>
<li><strong>민생</strong>: <strong>조세 감면</strong>, <strong>흑창</strong>(빈민 구제 기관).</li>
<li><strong>북진</strong>: 발해 유민·<strong>여진</strong> 수용과 북방 경영.</li>
</ul>
</div></details>
<details class="concept-nested"><summary>훈요 10조(태조 유훈)</summary><div class="concept-details-body">
<ul>
<li>후대 왕이 지켜야 할 <strong>통치 교훈 10조</strong>. 핵심 키워드: <strong>불교 숭상</strong>(국교적 성격), <strong>도선 풍수</strong>·사찰, <strong>거란 경계·의관 따르지 말 것</strong>(주체성), <strong>서경 백일 체류</strong>(지맥), <strong>연등·팔관 유지</strong>(후에 성종 때 폐지), <strong>차령 이남 인물 관직 제한</strong>(하대 신라 지역 반감), <strong>민생·탐관 엄단</strong> 등.</li>
<li>고려 <strong>불교 국가·풍수 정치</strong> 이념의 헌법적 성격.</li>
</ul>
</div></details>
</div></details>

<details class="concept-chapter"><summary>제2부 · 광종·성종 — 호족 격파와 유교적 중앙 집권</summary><div class="concept-details-body">
<p class="concept-chapter-hint">“힘으로 꺾고(광종), 제도로 굳힌다(성종).”</p>
<details class="concept-nested"><summary>광종의 개혁</summary><div class="concept-details-body">
<ul>
<li><strong>노비안검법</strong>(958): 불법 노비를 양인화 → ①국가 재정(세·역 부과 대상) 확대 ②호족 사노비·노동력·군사력 약화.</li>
<li><strong>독자 연호</strong> <code>광덕</code>·<code>준풍</code>, <strong>황제 칭호·공복</strong> → 중원과 대등한 외교 위상.</li>
<li>후반: <strong>쌍기</strong> 등용 후 문사 숙청·소인 득세 → <strong>시무 28조</strong>(최승로→성종)에서 비판.</li>
<li>후속: 경종 <strong>복수 허용·천민 환원</strong>, 성종 <strong>노비 환천</strong> 등 반동.</li>
</ul>
</div></details>
<details class="concept-nested"><summary>성종·최승로와 유교 국가 골격</summary><div class="concept-details-body">
<ul>
<li><strong>시무 28조</strong>: 유교 정치 이념에 따른 국정 개혁안.</li>
<li><strong>2성 6부</strong> 정비, <strong>12목</strong> 설치(지방관 파견), <strong>국자감·경학박사</strong>(박사·직강), <strong>연등회·팔관회 폐지</strong>, <strong>교방</strong>(왕실·귀족 자녀 교육).</li>
<li>광종이 호족을 <strong>힘</strong>으로 눌렀다면, 성종은 <strong>제도</strong>로 안정·전수.</li>
</ul>
</div></details>
<details class="concept-nested"><summary>현종과 지방 군사 행정</summary><div class="concept-details-body">
<ul>
<li><strong>5도 양계</strong> 완성: <strong>5도+안찰사</strong>=일반 민정, <strong>양계+병마사</strong>=군사(이름·성격 구분 암기).</li>
</ul>
</div></details>
</div></details>

<details class="concept-chapter"><summary>제3부 · 중앙 관제 — 2성 6부와 고려만의 기구</summary><div class="concept-details-body">
<details class="concept-nested"><summary>2성 6부·낭사</summary><div class="concept-details-body">
<ul>
<li><strong>2성</strong>: <strong>중서문하성</strong>(당의 중서+문하 합침)+<strong>상서성</strong>.</li>
<li><strong>6부</strong>: <strong>이·병·호·형·예·공</strong>(이병호형예공).</li>
<li><strong>재신</strong>: 정책 논의·결정, <strong>낭사</strong>: 봉박(왕명 부당 시 봉함) 등 <strong>서경권</strong>·언론.</li>
</ul>
</div></details>
<details class="concept-nested"><summary>군사·왕명·재정·감찰</summary><div class="concept-details-body">
<ul>
<li><strong>중추원</strong>: 추밀(군사 기밀)+승선(왕명 출납).</li>
<li><strong>어사대</strong>: 풍속 교정·관리 감찰 → <strong>대간</strong>(낭사+어사대) 견제 기능.</li>
<li><strong>삼사</strong>: 재정·회계·곡실·물가.</li>
<li><strong>도병마사</strong>·<strong>식목도감</strong>: 당에 없는 고려 <strong>독자 회의 기구</strong>(국방 vs 신제도 논의).</li>
</ul>
</div></details>
<details class="concept-nested"><summary>원 간섭기 관제 변화(참고)</summary><div class="concept-details-body">
<ul>
<li><strong>2성→첨의부</strong>, <strong>6부→4사</strong>, 칭호 <strong>조종→왕</strong> 등 몽골식 외압 반영.</li>
</ul>
</div></details>
</div></details>

<details class="concept-chapter"><summary>제4부 · 지방 제도 — 12목·주현·향리·3경</summary><div class="concept-details-body">
<details class="concept-nested"><summary>12목·5도·양계</summary><div class="concept-details-body">
<ul>
<li><strong>12목</strong>: 성종 때 지방에 파견된 수령급 관리 → 주현 통제·민정.</li>
<li><strong>주현 vs 속현</strong>: 주현=수령 파견(555), 속현=미파견(378)→<strong>향리</strong> 실질 통치.</li>
<li><strong>향리</strong>: 조세·지방군, 최고직 <strong>호장</strong>; 문종 때 일부 <strong>과거 진출</strong> 허용.</li>
</ul>
</div></details>
<details class="concept-nested"><summary>향·부곡·소·3경</summary><div class="concept-details-body">
<ul>
<li><strong>향·부곡</strong>: 국가 통제 농업, 이주·과거·결혼 제한.</li>
<li><strong>소</strong>: 국가 수공업 제품 생산.</li>
<li><strong>3경</strong>: 개경·서경·동경(후에 <strong>남경</strong>으로 변경).</li>
</ul>
</div></details>
</div></details>

<details class="concept-chapter"><summary>제5부 · 관리 임용 — 과거·음서·문벌 귀족</summary><div class="concept-details-body">
<details class="concept-nested"><summary>과거와 잡과·승과</summary><div class="concept-details-body">
<ul>
<li><strong>문과</strong>: <strong>제술과</strong>(시문·정책), <strong>명경과</strong>(유교 경전).</li>
<li><strong>잡과</strong>→<strong>기술관</strong>(법률·회계·지리), <strong>승과</strong>→<strong>승관</strong>(교종선·선종선).</li>
</ul>
</div></details>
<details class="concept-nested"><summary>음서·공음전·문벌</summary><div class="concept-details-body">
<ul>
<li><strong>음서</strong>: 왕실·공신·고위 관료 자손의 관직 진입.</li>
<li><strong>문벌 귀족 공식</strong>: 과거+음서+<strong>공음전</strong>(5품 이상 세습 허용)+혼인망→관직·토지 독점.</li>
</ul>
</div></details>
</div></details>

<details class="concept-chapter"><summary>제6부 · 문벌 동요 — 이자겸·묘청</summary><div class="concept-details-body">
<details class="concept-nested"><summary>이자겸의 난(1126)</summary><div class="concept-details-body">
<ul>
<li><strong>경원 이씨</strong> 외척 세력, 진압 후에도 <strong>왕권 실축</strong>·지배층 분열.</li>
</ul>
</div></details>
<details class="concept-nested"><summary>묘청의 난(1135)</summary><div class="concept-details-body">
<ul>
<li>주장: <strong>서경 천도</strong>·<strong>황제 칭호</strong>·<strong>독자 연호</strong>·<strong>금 정벌</strong> — 근거 <strong>풍수지리설</strong>.</li>
<li><strong>김부식</strong> 관군이 진압 → 서경 천도론 좌절.</li>
</ul>
</div></details>
</div></details>

<details class="concept-chapter"><summary>제7부 · 무신 정권</summary><div class="concept-details-body">
<details class="concept-nested"><summary>정변의 원인과 경과</summary><div class="concept-details-body">
<ul>
<li><strong>원인</strong>: 무신 차별, <strong>의종</strong>의 향락(<strong>보현원</strong>), 문신 중심 정치.</li>
<li><strong>연포루</strong>에서 이의방 등이 정변(1170).</li>
</ul>
</div></details>
<details class="concept-nested"><summary>기구·사병·집권자</summary><div class="concept-details-body">
<ul>
<li>기구: <strong>중방</strong>→<strong>교정도감</strong>(최충헌)→<strong>교정도감+정방</strong>(최우), 최우 때 <strong>서방</strong>(문인 통제).</li>
<li>사병: <strong>도방</strong>(경대승)→도방(최충헌)+<strong>삼별초</strong>(최우).</li>
<li>집권 순(초반): 이의방→정중부→경대승→이의민→<strong>최씨 4대</strong>(충헌·우·항·의)→김준·임연·임유무.</li>
</ul>
</div></details>
<details class="concept-nested"><summary>민중 저항</summary><div class="concept-details-body">
<ul>
<li><strong>망이·망소이</strong>(명학소), <strong>만적</strong>(최충헌 사노비, 개경 북산) 등.</li>
<li>원과의 전쟁기 <strong>삼별초</strong>(최이, 강화도 항전 등) 병행 암기.</li>
</ul>
</div></details>
</div></details>

<details class="concept-chapter"><summary>제8부 · 대외 관계 — 천하관·거란·송·여진</summary><div class="concept-details-body">
<details class="concept-nested"><summary>독자 천하관</summary><div class="concept-details-body">
<ul>
<li><strong>해동천자</strong>, 황제·폐하·성상, 수도를 <strong>황도</strong>로, <strong>독자 연호</strong>(태조 천수, 광종 광덕·준풍).</li>
</ul>
</div></details>
<details class="concept-nested"><summary>거란 3차·서희·강감찬·윤관</summary><div class="concept-details-body">
<ul>
<li><strong>1차</strong>: <strong>서희</strong> 담판(<strong>소손녕</strong>)→<strong>강동 6주</strong>.</li>
<li><strong>2차</strong>: 개경 함락 후 퇴각 등 복합 대응.</li>
<li><strong>3차</strong>: <strong>강감찬</strong> <strong>귀주대첩</strong>·<strong>천리장성</strong>.</li>
<li><strong>윤관</strong> <strong>동북 9성</strong>→방어 부담·여진 정세로 <strong>반환</strong>.</li>
</ul>
</div></details>
<details class="concept-nested"><summary>송·여진·해양</summary><div class="concept-details-body">
<ul>
<li><strong>벽란도</strong>: 송·거란·여진·일본 등과 연결된 무역항.</li>
<li><strong>예종</strong> 여진 정벌, <strong>숙종</strong> 요동 정벌 중단 논쟁, <strong>금</strong>과의 긴장 등 외정 흐름.</li>
</ul>
</div></details>
</div></details>

<details class="concept-chapter"><summary>제9부 · 전시과·조세·화폐</summary><div class="concept-details-body">
<details class="concept-nested"><summary>전시과의 구조</summary><div class="concept-details-body">
<ul>
<li><strong>전지</strong>=곡물 수취권, <strong>시지</strong>=땔감 채취권. 원칙적 세습 불가.</li>
<li><strong>공음전</strong>: 5품 이상만 세습 가능 → 문벌 경제 기반.</li>
</ul>
</div></details>
<details class="concept-nested"><summary>시정·개정·경정</summary><div class="concept-details-body">
<ul>
<li><strong>시정</strong>(경종): 인품+관품, <strong>개정</strong>(목종): 전·현직, <strong>경정</strong>(문종): 현직만 → 수급 대상 축소·토지 부족 반영.</li>
<li>말기 <strong>과전법</strong>(경기도 한정)로 연결.</li>
</ul>
</div></details>
<details class="concept-nested"><summary>조세·공납·역</summary><div class="concept-details-body">
<ul>
<li><strong>양안+호적</strong>, 조세 대략 <strong>십분의일</strong>, <strong>상공</strong>(매년)+<strong>별공</strong>(수시).</li>
<li><strong>역</strong>: 16~59세 양인 정남, 요역·군역.</li>
<li><strong>활구</strong>(은병)=베 100필, 금속 화폐 유통 한계로 실물 경제.</li>
<li><strong>원 간섭기</strong>: <strong>보초</strong>(원 지폐), <strong>건원중보</strong> 등.</li>
</ul>
</div></details>
</div></details>

<details class="concept-chapter"><summary>제10부 · 신분제·노비·여성</summary><div class="concept-details-body">
<details class="concept-nested"><summary>양천제·정호·백정</summary><div class="concept-details-body">
<ul>
<li><strong>양천제</strong>, <strong>일천즉천</strong>(한쪽 천이면 자녀도 천인).</li>
<li><strong>정호</strong>: 직역(요역) 부담→토지 수급, <strong>백정</strong>: 직역 없는 농민층.</li>
<li><strong>공노비</strong> 입역/외거, <strong>사노비</strong> 솔거/외거.</li>
</ul>
</div></details>
<details class="concept-nested"><summary>여성·가족</summary><div class="concept-details-body">
<ul>
<li><strong>호주</strong> 가능, 별도 재산·상속, 재혼 비교적 자유, 처가 거주·외가 음서·상피제와 맞물린 혼망 전략.</li>
</ul>
</div></details>
</div></details>

<details class="concept-chapter"><summary>제11부 · 불교·유교·학술 문화</summary><div class="concept-details-body">
<details class="concept-nested"><summary>불교</summary><div class="concept-details-body">
<ul>
<li><strong>의천</strong>: 해동천태종, <strong>교관겸수</strong>(교종 중심 선종 통합), 『교장』.</li>
<li><strong>지눌</strong>: 수선사·송광사, <strong>정혜쌍수·돈오점수</strong>, 선종 중심.</li>
<li><strong>요세</strong>: 백련사, 참회 실천(천태).</li>
<li><strong>결사운동</strong>: 교·선 갈등 이후 재편.</li>
<li><strong>팔만대장경</strong>: 고종대 국난 극복·경전 보존, 해인사 보존.</li>
</ul>
</div></details>
<details class="concept-nested"><summary>유교·성리학·사학·사서</summary><div class="concept-details-body">
<ul>
<li><strong>도선</strong>: 풍수지리설 체계화.</li>
<li><strong>안향</strong>→<strong>이제현</strong>(만권당)→<strong>이색</strong> 등 성리학 수용.</li>
<li><strong>최충</strong>: 9재 학당·<strong>문헌공도</strong> → 성종대 <strong>7재·양현고</strong> 등 관학 진흥.</li>
<li>저술: 김부식『삼국사기』(기전체), 이규보『동명왕편』, 일연『삼국유사』, 이승휴『제왕운기』.</li>
<li><strong>정도전</strong>『불씨잡변』: 성리학적 불교 비판.</li>
</ul>
</div></details>
</div></details>

<details class="concept-chapter"><summary>제12부 · 원 간섭기·권문세족</summary><div class="concept-details-body">
<details class="concept-nested"><summary>부마국·간섭 기구</summary><div class="concept-details-body">
<ul>
<li>고려 왕·<strong>원 공주</strong> 혼인, <strong>조공·역진</strong>, <strong>정동행성·다루가치</strong> 내정 간섭.</li>
<li><strong>권문세족</strong>: 친원·대토지·노비, 실권 기구 <strong>도평의사사</strong>.</li>
</ul>
</div></details>
<details class="concept-nested"><summary>몽골 재침과 고종</summary><div class="concept-details-body">
<ul>
<li>1232년 재침에 <strong>강화도 천도</strong>(고종).</li>
</ul>
</div></details>
</div></details>

<details class="concept-chapter"><summary>제13부 · 고려 말 개혁과 조선 건국</summary><div class="concept-details-body">
<details class="concept-nested"><summary>공민왕·신돈</summary><div class="concept-details-body">
<ul>
<li><strong>반원·자주화</strong>: 몽골식 폐지, 친원 제거, 정동행성 이문소 폐지, 쌍성총관부·철령 이북.</li>
<li><strong>왕권 강화</strong>: 정방 폐지, <strong>신돈</strong>+전민변정도감, 성균관·과거, 신진사대부.</li>
<li><strong>전민변정도감</strong>: 빼앗긴 토지·노비 환원.</li>
<li>실패 요인: 권문 반발, <strong>홍건적·왜구</strong>, 신돈 제거.</li>
</ul>
</div></details>
<details class="concept-nested"><summary>위화도 회군·과전법·1392</summary><div class="concept-details-body">
<ul>
<li><strong>최영</strong> 요동 정벌 vs <strong>이성계</strong> 회군 명분.</li>
<li><strong>급진파 정도전</strong> vs <strong>온건파 정몽주</strong>(과전법 반대).</li>
<li><strong>과전법</strong> 경기도 한정 → 정몽주 제거 → <strong>1392 조선 건국</strong>.</li>
<li>지배층 흐름: 호족→문벌→무신→권문→<strong>신진사대부</strong>.</li>
</ul>
</div></details>
</div></details>

<p class="concept-note" style="margin-top:1rem">암기 팁: 왕대·인물·제도를 한 줄로 연결해 스토리를 만든 뒤(예: “광종 노비안검→성종 12목→문종 향리 과거”), 퀴즈 카테고리 이름과 맞춰 복습하면 빈칸이 줄어듭니다.</p>

{id:242,cat:"광종",q:"황제 칭호를 사용한 고려 왕은?",a:"광종",opts:["광종","태조만","문종만","공민왕만"],ex:"독자 외교 위상."},
{id:243,cat:"인종",q:"묘청이 주장한 천도지는?",a:"서경",opts:["서경","개경","남경","평양"],ex:"풍수지리설."},
{id:244,cat:"고려말",q:"과전법이 적용된 지역은?",a:"경기도",opts:["경기도","전국","제주만","서경만"],ex:"점진적 개혁."},
{id:245,cat:"신분제",q:"사노비 '솔거'의 의미는?",a:"주인 집에 살며 종살이",opts:["주인 집에 살며 종살이","궁궐 상주","독립 농민","관료"],ex:"공노비 입역과 대비."},
{id:246,cat:"대외관계",q:"1차 거란 침입 뒤 강동 6주 확보와 직결된 활동은?",a:"서희의 담판·외교",opts:["서희의 담판·외교","윤관의 9성","위화도 회군","삼별초"],ex:"강동 6주 분쟁 해결."},
{id:247,cat:"후삼국",q:"후백제를 건국한 연도는?",a:"900",opts:["900","918","935","936"],ex:"견훤."},
{id:248,cat:"후삼국",q:"후고구려(태봉)가 세워진 연도는?",a:"901",opts:["901","918","936","1392"],ex:"궁예."},
{id:249,cat:"고려말",q:"이성계가 즉위한 연도는?",a:"1392",opts:["1392","1388","1400","936"],ex:"조선 건국."},
{id:250,cat:"유교·문화",q:"김부식이 편찬한 역사서는?",a:"『삼국사기』",opts:["『삼국사기』","『삼국유사』","『동명왕편』","『제왕운기』"],ex:"1145년."},
];

const CATS=[...new Set(Q.map(q=>q.cat))];
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}return b};

const HIST_LS_KEY="history-quiz-progress-v1";
function emptyHistProg(){return{mastered:{},wrongCnt:{},best:0};}
function mergeHistProg(raw){
  const o=emptyHistProg();
  if(!raw||typeof raw!=="object")return o;
  if(raw.mastered&&typeof raw.mastered==="object")Object.assign(o.mastered,raw.mastered);
  if(raw.wrongCnt&&typeof raw.wrongCnt==="object")Object.assign(o.wrongCnt,raw.wrongCnt);
  if(typeof raw.best==="number"&&raw.best>=0)o.best=raw.best;
  return o;
}
function loadHistProg(){try{const t=localStorage.getItem(HIST_LS_KEY);return mergeHistProg(t?JSON.parse(t):null)}catch(e){return emptyHistProg()}}
function saveHistProg(){try{localStorage.setItem(HIST_LS_KEY,JSON.stringify({mastered:S.mastered,wrongCnt:S.wrongCnt,best:S.best}))}catch(e){}}
let S=Object.assign(loadHistProg(),{topView:"quiz",streak:0,queue:shuffle(Q.map(q=>q.id)),sel:null,phase:"menu",catF:null,sess:{c:0,w:0},timer:0,timerOn:false,revIdx:0,showCard:false,lockedQ:null,lockedOpts:[]});
let timerInterval=null;
const $=id=>document.getElementById(id);
const app=$("app");

function bindHistTabs(){
  const nav=$("histTopnav");
  if(!nav||nav.dataset.bound)return;
  nav.dataset.bound="1";
  nav.addEventListener("click",function(ev){
    const btn=ev.target.closest("[data-hist-view]");
    if(!btn)return;
    const v=btn.getAttribute("data-hist-view");
    if(!v||S.topView===v)return;
    if(S.topView==="quiz"&&S.phase==="quiz"&&S.timerOn)stopTimer();
    S.topView=v;
    nav.querySelectorAll(".hist-topnav__btn").forEach(function(b){
      const on=b.getAttribute("data-hist-view")===v;
      b.classList.toggle("is-on",on);
      b.setAttribute("aria-selected",on?"true":"false");
    });
    if(v==="quiz"&&S.phase==="quiz"&&S.lockedQ)startTimer();
    render();
  });
}

function renderHistoryConcepts(){
  const tpl=$("histConceptTpl");
  app.innerHTML="";
  if(tpl&&tpl.content)app.appendChild(tpl.content.cloneNode(true));
  else app.innerHTML='<p class="concept-note">역사 개념 템플릿을 불러오지 못했습니다.</p>';
}

function filt(){return S.catF?Q.filter(q=>q.cat===S.catF):Q}
function mCnt(){return filt().filter(q=>S.mastered[q.id]).length}
function pct(){const f=filt();return f.length?Math.round(mCnt()/f.length*100):0}
function tM(){return Q.filter(q=>S.mastered[q.id]).length}
function tP(){return Math.round(tM()/Q.length*100)}
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function nextQ(){const n=S.queue.find(id=>{const q=Q.find(x=>x.id===id);return(!S.catF||q.cat===S.catF)&&!S.mastered[id]});return n?Q.find(q=>q.id===n):null}
function wrongQs(){return Q.filter(q=>S.wrongCnt[q.id]&&!S.mastered[q.id]).sort((a,b)=>(S.wrongCnt[b.id]||0)-(S.wrongCnt[a.id]||0))}
function weakCats(){const m={};Q.forEach(q=>{if(!m[q.cat])m[q.cat]={w:0,t:0};m[q.cat].t++;if(S.wrongCnt[q.id])m[q.cat].w+=S.wrongCnt[q.id]});return Object.entries(m).sort((a,b)=>b[1].w/b[1].t-a[1].w/a[1].t).filter(([,v])=>v.w>0).slice(0,3)}
function catSt(c){const qs=Q.filter(q=>q.cat===c);const m=qs.filter(q=>S.mastered[q.id]).length;return{t:qs.length,m,p:Math.round(m/qs.length*100)}}
function tickHistTimer(){
  S.timer++;
  const el=document.getElementById("hist-quiz-timer");
  if(el)el.textContent=fmt(S.timer);
  else render();
}
function startTimer(){S.timerOn=true;clearInterval(timerInterval);timerInterval=setInterval(tickHistTimer,1000)}
function stopTimer(){S.timerOn=false;clearInterval(timerInterval)}

function lockNext(){
  const nq=nextQ();
  if(nq){S.lockedQ=nq;S.lockedOpts=shuffle(nq.opts)}
  else{S.lockedQ=null;S.lockedOpts=[]}
}

function go(cat){S.catF=cat;S.queue=shuffle(Q.map(q=>q.id));S.sel=null;S.sess={c:0,w:0};S.timer=0;S.lockedQ=null;S.lockedOpts=[];S.phase="quiz";lockNext();startTimer();render()}
function rev(){S.revIdx=0;S.showCard=false;S.phase="review";render()}
function rst(){
  if(!confirm("저장된 진행도(맞춘 문제·오답 횟수·연속 기록)를 모두 지울까요?"))return;
  S.mastered={};S.wrongCnt={};S.streak=0;S.best=0;S.queue=shuffle(Q.map(q=>q.id));S.sess={c:0,w:0};S.sel=null;S.timer=0;S.lockedQ=null;S.lockedOpts=[];
  saveHistProg();render();
}
function toMenu(){S.phase="menu";stopTimer();S.lockedQ=null;S.lockedOpts=[];S.sel=null;render()}

function pick(o){
  if(S.sel!==null||!S.lockedQ)return;
  S.sel=o;const ok=o===S.lockedQ.a;
  if(ok){S.mastered[S.lockedQ.id]=true;S.sess.c++;S.streak++;if(S.streak>S.best)S.best=S.streak}
  else{S.wrongCnt[S.lockedQ.id]=(S.wrongCnt[S.lockedQ.id]||0)+1;S.sess.w++;S.streak=0;
    const rest=S.queue.filter(id=>id!==S.lockedQ.id);S.queue=[...rest,S.lockedQ.id]}
  saveHistProg();render()
}

function nxt(){S.sel=null;S.lockedQ=null;S.lockedOpts=[];lockNext();render()}

function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}

function histNorm(s){return String(s||"").replace(/\s+/g,"")}
function histMatchedConceptBodies(cat){
  const tpl=document.getElementById("histConceptTpl");
  if(!tpl||!cat)return[];
  const nc=histNorm(cat);
  const out=[];
  tpl.content.querySelectorAll("details.concept-nested").forEach(function(det){
    const sum=det.querySelector(":scope > summary");
    const body=det.querySelector(":scope > .concept-details-body");
    if(!sum||!body)return;
    const nt=histNorm(sum.textContent);
    let hit=nt.indexOf(nc)>=0;
    if(!hit){
      cat.split(/[·\/]/).forEach(function(piece){
        const np=histNorm(piece);
        if(np.length>=2&&nt.indexOf(np)>=0)hit=true;
      });
    }
    if(hit)out.push({title:sum.textContent.trim(),html:body.innerHTML});
  });
  const seen=new Set();
  return out.filter(function(x){
    if(seen.has(x.title))return false;
    seen.add(x.title);
    return true;
  }).slice(0,3);
}
function buildHistWrongRefTabsHtml(cat){
  const bodies=histMatchedConceptBodies(cat);
  if(!bodies.length)return "";
  const tabs=bodies.map(function(b){
    return `<details class="wrong-ref-tab"><summary>${esc(b.title)}</summary><div class="wrong-ref-tab-body concept-details-body">${b.html}</div></details>`;
  }).join("");
  return `<div class="wrong-ref-wrap"><p class="wrong-ref-intro"><strong>역사 개념</strong> 탭에서 이 단원과 맞닿은 소제목만 골라 두었습니다. 필요한 제목만 펼쳐 보세요.</p>${tabs}</div>`;
}

function render(){
  bindHistTabs();
  if(S.topView==="concepts"){renderHistoryConcepts();return;}
  if(S.phase==="menu")renderMenu();
  else if(S.phase==="review")renderReview();
  else renderQuiz();
}

function renderMenu(){
  const tp=tP(),tm=tM(),wk=weakCats(),wqs=wrongQs();
  let h=`<p style="text-align:center;font-size:14px;color:#666;line-height:1.65;margin:0 0 24px">${Q.length}문제 · 즉시 피드백·해설 · 틀리면 맨 뒤로 재배치 · 100%=전범위 보장 · 진행도는 이 브라우저에 기억되어 새로고침해도 유지되며, 아래 초기화 버튼으로만 삭제할 수 있습니다.</p>
  <div class="progress-box">
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px"><span style="font-weight:500;color:var(--color-text-primary)">전체</span><span style="color:var(--color-text-secondary)">${tm}/${Q.length} (${tp}%)</span></div>
    <div class="bar"><div class="bar-fill" style="width:${tp}%;background:${tp===100?'var(--color-text-success)':'var(--color-text-info)'}"></div></div>
    ${S.best>0?`<div style="font-size:10px;color:var(--color-text-tertiary);margin-top:4px">최고 연속 정답: ${S.best}</div>`:""}
  </div>`;

  if(wk.length>0){h+=`<div class="weak-box"><div style="font-size:11px;font-weight:500;color:var(--color-text-warning);margin-bottom:3px">취약 영역</div>${wk.map(([c,v])=>`<div style="font-size:11px;color:var(--color-text-secondary)">${esc(c)} — 오답 ${v.w}회/${v.t}문제</div>`).join("")}</div>`}
  if(wqs.length>0){h+=`<button class="btn review-btn" onclick="rev()">오답 플래시카드 복습 (${wqs.length}문제)</button>`}

  h+=`<button class="btn btn-main" onclick="go(null)">${tm===0?"학습 시작":"이어서 풀기"} — ${Q.length-tm}문제 남음</button>
  <div style="font-size:13px;font-weight:700;color:#0ea5e9;margin-bottom:10px">카테고리별</div>`;

  CATS.forEach(c=>{const s=catSt(c);
    h+=`<button class="btn cat-btn" onclick="go('${esc(c)}')"><span style="color:${s.p===100?'var(--color-text-success)':'var(--color-text-primary)'}">${esc(c)}</span><span style="display:flex;align-items:center;gap:5px"><span style="color:var(--color-text-tertiary);font-size:10px">${s.m}/${s.t}</span><span class="cat-bar"><span class="cat-bar-fill" style="width:${s.p}%;background:${s.p===100?'var(--color-text-success)':'var(--color-text-info)'}"></span></span></span></button>`});

  if(tm>0||Object.keys(S.wrongCnt).length)h+=`<button type="button" onclick="rst()" style="margin-top:18px;padding:10px 28px;border:none;border-radius:8px;background:#888;color:#fff;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600">저장된 진행도 초기화</button>`;
  app.innerHTML=h;
}

function renderReview(){
  const wqs=wrongQs();const rq=wqs[S.revIdx];
  if(!rq){app.innerHTML=`<div style="text-align:center;padding:2rem 0"><p style="font-size:13px;color:var(--color-text-secondary)">복습할 오답이 없습니다.</p><button class="btn" style="width:auto;display:inline-block;margin-top:10px;padding:8px 18px" onclick="toMenu()">메뉴로</button></div>`;return}

  let h=`<div style="display:flex;justify-content:space-between;margin-bottom:14px"><button class="link-btn" onclick="toMenu()">← 메뉴</button><span style="font-size:10px;color:var(--color-text-tertiary)">${S.revIdx+1}/${wqs.length}</span></div>
  <div style="font-size:10px;color:var(--color-text-warning);margin-bottom:5px">오답 ${S.wrongCnt[rq.id]}회 — ${esc(rq.cat)}</div>
  <div class="card" onclick="S.showCard=!S.showCard;render()">`;

    if(!S.showCard){h+=`<div style="font-size:14px;font-weight:500;color:var(--color-text-primary);line-height:1.6;margin-bottom:6px">${esc(rq.q)}</div><div style="font-size:10px;color:var(--color-text-tertiary)">탭하여 정답 보기</div>`}
  else{h+=`<div style="font-size:10px;font-weight:600;color:var(--color-text-tertiary);margin-bottom:4px">관련 개념(단원)</div><div style="font-size:12px;font-weight:600;color:var(--color-text-primary);margin-bottom:10px">${esc(rq.cat)}</div><div style="font-size:14px;font-weight:500;color:var(--color-text-success);line-height:1.6;margin-bottom:6px">${esc(rq.a)}</div><div style="font-size:11px;color:var(--color-text-secondary);line-height:1.6"><strong style="color:var(--color-text-primary)">해설·풀이</strong> — ${esc(rq.ex)}</div>`}

  h+=`</div><div style="display:flex;gap:6px;margin-top:12px">
  <button class="btn" style="flex:1;text-align:center;${S.revIdx===0?'color:var(--color-text-tertiary);cursor:default':''}" ${S.revIdx===0?'disabled':''} onclick="S.revIdx--;S.showCard=false;render()">← 이전</button>
  <button class="btn" style="flex:1;text-align:center;font-weight:500;border-color:var(--color-border-secondary)" onclick="${S.revIdx<wqs.length-1?'S.revIdx++;S.showCard=false;render()':'toMenu()'}">${S.revIdx<wqs.length-1?"다음 →":"완료"}</button></div>`;
  app.innerHTML=h;
}

function renderQuiz(){
  const cur=S.lockedQ;const unmast=filt().filter(q=>!S.mastered[q.id]).length;const done=!cur&&unmast===0;const p=pct();const mc=mCnt();const fl=filt().length;
  const rate=S.sess.c+S.sess.w>0?Math.round(S.sess.c/(S.sess.c+S.sess.w)*100):0;

  let h=`<div class="header"><button class="link-btn" onclick="toMenu()">← 메뉴</button><div style="display:flex;gap:10px;font-size:10px;color:var(--color-text-tertiary)"><span id="hist-quiz-timer">${fmt(S.timer)}</span>${S.streak>=3?`<span style="color:var(--color-text-warning);font-weight:500">연속 ${S.streak}정답!</span>`:""}</div></div>
  <div class="meta"><span>${esc(S.catF||"전체")}</span><span>${mc}/${fl} 마스터 · 정답률 ${rate}%</span></div>
  <div class="bar bar-sm"><div class="bar-fill" style="width:${p}%;background:${p===100?'var(--color-text-success)':'var(--color-text-info)'}"></div></div>`;

  if(done){
    h+=`<div style="text-align:center;padding:40px 12px"><div style="font-size:48px;margin-bottom:8px;color:#4CAF50;line-height:1">&#10003;</div><h3 style="font-size:1.35em;font-weight:700;color:#0ea5e9;margin:0 0 10px">${esc(S.catF||"전체")} 완료!</h3><p style="font-size:1.05em;color:#666;margin:0 0 6px">${S.sess.c}정답 / ${S.sess.w}오답 · ${fmt(S.timer)}</p>${S.sess.w>0?`<p style="font-size:0.95em;color:#e65100;margin-bottom:4px">오답 ${S.sess.w}문제 → 메뉴에서 복습 가능</p>`:""}<button class="btn btn-next" style="margin-top:18px" onclick="toMenu()">메뉴로</button></div>`;
  } else if(cur){
    h+=`<div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:10px;color:var(--color-text-tertiary)">${esc(cur.cat)}</span>${S.wrongCnt[cur.id]>0&&S.sel===null?`<span style="font-size:10px;color:var(--color-text-warning)">이전 오답 ${S.wrongCnt[cur.id]}회</span>`:""}</div>
    <h3 style="font-size:14px;font-weight:500;color:var(--color-text-primary);margin:0 0 14px;line-height:1.6">${esc(cur.q)}</h3>
    <div style="display:flex;flex-direction:column;gap:5px">`;

    S.lockedOpts.forEach((o,i)=>{
      const isA=o===cur.a,isS=o===S.sel;
      let cls="",lbl="",extra="";
      if(S.sel!==null){
        if(isA){cls="bg-ok";lbl="정답";extra="color:var(--color-text-success)"}
        else if(isS&&!isA){cls="bg-err";lbl="오답";extra="color:var(--color-text-danger)"}
        else{extra="color:var(--color-text-tertiary)"}
      }
      const pad=`padding-left:48px;${lbl?"padding-right:52px":""}`;
      h+=`<button type="button" class="btn ${cls}" ${S.sel!==null?"disabled":""} onclick="pick('${o.replace(/'/g,"\\'")}')" style="${extra};${pad}"><span class="opt-num" aria-hidden="true">${i+1}</span>${esc(o)}${lbl?`<span class="opt-label">${lbl}</span>`:""}</button>`;
    });
    h+=`</div>`;

    if(S.sel!==null){
      const exHtml=cur.ex?esc(cur.ex):"(이 문항에는 별도 해설이 없습니다.)";
      h+=`<div style="margin-top:10px">`;
      if(S.sel!==cur.a){
        h+=`<div class="wrong-learn-box" style="padding:10px 14px 14px;border-radius:12px;border:1px solid rgba(244,67,54,0.35);background:linear-gradient(135deg,#fff8f8 0%,#ffebee 100%);box-shadow:0 2px 10px rgba(244,67,54,0.08);margin-bottom:10px">
          <div style="margin-bottom:8px">
            <div style="font-size:10px;font-weight:600;color:var(--color-text-tertiary);margin-bottom:4px">이 문항 단원</div>
            <div style="font-size:13px;font-weight:600;color:var(--color-text-primary)">${esc(cur.cat)}</div>
          </div>
          <div style="margin-bottom:8px">
            <div style="font-size:10px;font-weight:600;color:var(--color-text-tertiary);margin-bottom:4px">정답</div>
            <div style="font-size:14px;font-weight:600;color:#1b5e20">${esc(cur.a)}</div>
          </div>
          <div style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid rgba(183,28,28,0.12)">
            <div style="font-size:10px;font-weight:600;color:var(--color-text-tertiary);margin-bottom:4px">해설·문제 풀이</div>
            <div style="font-size:12px;color:#444;line-height:1.65">${exHtml}</div>
          </div>
          ${buildHistWrongRefTabsHtml(cur.cat)}
        </div>
        <div style="font-size:11px;color:var(--color-text-danger);margin-bottom:8px">이 문제는 대기열 맨 뒤로 보내져, 다른 문제를 먼저 풉니다.</div>`;
      }else{
        h+=`<div class="ex-box"><div style="font-size:10px;font-weight:600;color:var(--color-text-tertiary);margin-bottom:6px">해설</div><div style="font-size:11px;color:var(--color-text-secondary);line-height:1.6">${exHtml}</div></div>`;
      }
      h+=`<button class="btn btn-next" onclick="nxt()">다음 →</button></div>`;
    }
  } else {
    h+=`<div style="text-align:center;padding:24px 0;color:var(--color-text-tertiary);font-size:12px">불러오는 중...</div>`;
  }
  app.innerHTML=h;
}

document.addEventListener("keydown",function(ev){
  if(ev.target&&["INPUT","TEXTAREA","SELECT"].includes(ev.target.tagName))return;
  if(ev.target&&ev.target.isContentEditable)return;
  if(S.topView!=="quiz")return;
  if(ev.key==="Enter"&&S.phase==="quiz"&&S.sel!==null&&S.lockedQ){
    ev.preventDefault();
    nxt();
    return;
  }
  if(S.phase!=="quiz"||S.sel!==null||!S.lockedQ||!S.lockedOpts.length)return;
  const m=/^(?:Digit|Numpad)([1-9])$/.exec(ev.code);
  if(!m)return;
  const idx=Number(m[1])-1;
  if(idx>=S.lockedOpts.length)return;
  ev.preventDefault();
  pick(S.lockedOpts[idx]);
});

render();
</script>
