<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>프랑스어 단어 암기 · 중간 대비</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="site-theme.css" />
  <link rel="stylesheet" href="auth.css" />
  <script src="auth-config.js"></script>
  <script src="auth.js"></script>
  <style>
    :root {
      --font: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --card-radius: 24px;
      --card-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 24px 48px -12px rgba(14, 165, 233, 0.28);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font);
      min-height: 100vh;
      padding: clamp(24px, 5vw, 48px) 20px 120px;
      color: var(--text);
      }
    .shell { max-width: 720px; margin: 0 auto; }
    
    .page-card {
      background: rgba(255, 255, 255, 0.97);
      border-radius: var(--card-radius);
      padding: clamp(28px, 5vw, 40px) clamp(20px, 4vw, 36px);
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(255, 255, 255, 0.65);
    }
    .video-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: 16px;
      overflow: hidden;
      background: var(--sky-100);
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.2);
    }
    .video-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .link-row {
      margin-top: 1.25rem;
      text-align: center;
      font-size: 0.875rem;
    }
    .link-row a {
      color: #0284c7;
      font-weight: 600;
      text-decoration: none;
      word-break: break-all;
    }
    .link-row a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="shell">
    <nav class="site-nav">
      <a class="site-nav__link" href="index.html#midterm">&larr; 중간 대비 메인</a>
    </nav>
    <div class="page-card">
      <div class="video-wrap">
        <iframe
          src="https://www.youtube.com/embed/Y95-9x7NWi0"
          title="YouTube"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      </div>
      <p class="link-row">
        <a href="https://youtu.be/Y95-9x7NWi0" target="_blank" rel="noopener noreferrer">https://youtu.be/Y95-9x7NWi0</a>
      </p>
    </div>
  </div>
  <div class="footer">제작자: 정해우</div>
  <link rel="stylesheet" href="ai-quiz-ui.css" />
  <script src="ai-quiz-config.js"></script>
  <script src="ai-quiz-bridge.js"></script>
  <script src="ai-quiz-runner.js"></script>
  <script src="ai-quiz-subjects.js"></script>
  <link rel="stylesheet" href="bgm-player.css" />
  <script src="bgm-player.js" defer></script>
</body>
</html>
