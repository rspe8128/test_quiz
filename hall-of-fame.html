<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>명예의 전당 · 민사 1-1</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="site-theme.css" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="hall-of-fame.css" />
  <script src="auth-config.js"></script>
  <script src="auth.js"></script>
</head>
<body class="hof-page">
  <div class="hof-bg" aria-hidden="true">
    <div class="hof-rays"></div>
    <div class="hof-rays hof-rays--2"></div>
    <div class="hof-vignette"></div>
  </div>

  <div class="hof-wrap">
    <nav class="site-nav hof-nav">
      <a class="site-nav__link hof-nav__link" href="index.html">&larr; 퀴즈 허브</a>
    </nav>

    <header class="hof-hero">
      <p class="hof-hero__eyebrow">민사 1-1 · VIP SUPPORTERS</p>
      <div class="hof-hero__ornament" aria-hidden="true">◆</div>
      <h1 class="hof-hero__title">명예의 전당</h1>
      <p class="hof-hero__en">HALL OF FAME</p>
      <div class="hof-hero__line" aria-hidden="true"></div>
    </header>

    <p class="hof-scroll-hint" aria-hidden="true"><span>←</span> 좌우로 스크롤 <span>→</span></p>

    <div class="hof-scroll-wrap" id="hofScroll">
      <ul class="hof-banners" id="hofList">
        <li class="hof-empty">불러오는 중…</li>
      </ul>
    </div>

    <section class="hof-edit" id="hofEdit" hidden>
      <div class="hof-edit__badge">VIP 전용</div>
      <h2>내 배너 꾸미기</h2>
      <p class="hof-edit__lead">프로필 사진과 한마디를 등록하면 명예의 전당 배너에 표시됩니다.</p>
      <div class="hof-edit__row">
        <button type="button" class="hof-edit__avatar-btn" id="hofAvatarBtn" aria-label="프로필 사진 변경">
          <span class="hof-edit__avatar-ring"></span>
          <span class="hof-edit__avatar-inner">사진<br>선택</span>
        </button>
        <div class="hof-edit__idbox">
          <label class="hof-field hof-field--compact">
            <span>아이디</span>
            <input type="text" id="hofUsername" readonly />
          </label>
        </div>
      </div>
      <input type="file" id="hofAvatarFile" accept="image/jpeg,image/png,image/webp,image/gif" />
      <label class="hof-field">
        <span>한마디 (프로필 아래 표시)</span>
        <textarea id="hofMessage" maxlength="80" rows="2" placeholder="후원해 주셔서 감사합니다!"></textarea>
        <small>최대 80자</small>
      </label>
      <button type="button" class="hof-save" id="hofSaveBtn">프로필 저장</button>
      <p class="hof-msg-box" id="hofSaveMsg" hidden></p>
    </section>
  </div>
  <div class="footer hof-footer">제작자: 정해우</div>
  <script src="hall-of-fame.js"></script>
</body>
</html>
