<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>명예의 전당 · 민사 1-1</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="site-theme.css" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="hall-of-fame.css" />
  <script src="auth-config.js"></script>
  <script src="auth.js"></script>
</head>
<body>
  <div class="hof-wrap">
    <nav class="site-nav" style="margin-bottom:1rem;">
      <a class="site-nav__link" href="index.html">&larr; 퀴즈 허브</a>
    </nav>

    <div class="hof-card">
      <h1 class="hof-header">명예의 전당</h1>
      <ul class="hof-list" id="hofList">
        <li class="hof-empty">불러오는 중…</li>
      </ul>

      <section class="hof-edit" id="hofEdit" hidden>
        <h2>내 VIP 프로필</h2>
        <div class="hof-edit__row">
          <button type="button" class="hof-edit__avatar-btn" id="hofAvatarBtn" aria-label="프로필 사진 변경">
            <span>사진<br>선택</span>
          </button>
          <div>
            <p class="hof-field" style="margin-bottom:0.5rem;">
              <span>아이디</span>
              <input type="text" id="hofUsername" readonly />
            </p>
            <p style="font-size:0.78rem;color:#a16207;">VIP만 프로필 사진과 한마디를 등록할 수 있습니다.</p>
          </div>
        </div>
        <input type="file" id="hofAvatarFile" accept="image/jpeg,image/png,image/webp,image/gif" />
        <label class="hof-field">
          <span>한마디</span>
          <textarea id="hofMessage" maxlength="80" rows="2" placeholder="후원해 주셔서 감사합니다!"></textarea>
          <small>최대 80자</small>
        </label>
        <button type="button" class="hof-save" id="hofSaveBtn">저장</button>
        <p class="hof-msg-box" id="hofSaveMsg" hidden></p>
      </section>
    </div>
  </div>
  <div class="footer">제작자: 정해우</div>
  <script src="hall-of-fame.js"></script>
</body>
</html>
