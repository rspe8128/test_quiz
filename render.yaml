services:
  - type: web
    name: minsa-ai-quiz-api
    runtime: python
    rootDir: ai-quiz-server
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: AUTH_ADMIN_USERNAME
        value: rspe
      - key: AUTH_ADMIN_PASSWORD
        sync: false
      - key: AUTH_ADMIN_DISPLAY
        value: 유노 남친
      - key: AI_QUIZ_HOST
        value: 0.0.0.0
      # 계정 영구 저장 (무료): turso.tech 에서 DB 생성 후 Render에 설정
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # 유료 Starter 플랜 + 영구 디스크(/var/data) 연결 시 선택
      - key: AUTH_DB_PATH
        sync: false
