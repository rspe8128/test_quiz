services:
  - type: web
    name: minsa-ai-quiz-api
    runtime: python
    rootDir: ai-quiz-server
    buildCommand: echo "no build"
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_QUIZ_HOST
        value: 0.0.0.0
